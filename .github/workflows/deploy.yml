name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - 'offprint-site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: offprint-site/package-lock.json

      - name: Install and build
        working-directory: offprint-site
        run: |
          npm ci
          npm run build
          # GitHub Pages runs Jekyll by default; Astro emits `_astro/`, which
          # Jekyll would ignore without this marker.
          touch dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: offprint-site/dist
          clean: true
          single-commit: true
